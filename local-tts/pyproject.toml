[project]
name = "gridsplit-local-tts"
version = "0.1.0"
description = "Optional loopback-only Kokoro ONNX service for GridSplit Studio"
requires-python = ">=3.10,<3.14"
dependencies = [
  "kokoro-onnx==0.6.1",
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<1",
  "soundfile>=0.13,<1",
]
[dependency-groups]
dev = [
  "pip-audit==2.10.1",
]

[tool.uv]
package = false
