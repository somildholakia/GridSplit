name: Refresh npm lock and validate PDF import

on:
  push:
    branches: [feat/m06-m11-studio-script-workflow]

permissions:
  contents: write

concurrency:
  group: gridsplit-dependency-refresh
  cancel-in-progress: false

jobs:
  refresh-and-validate:
    name: Refresh lockfile, test and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Refresh the npm lockfile
        run: npm install --package-lock-only --no-audit --no-fund

      - name: Install from the refreshed lockfile
        run: npm ci --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test -- --reporter=verbose

      - name: Typecheck
        run: npm run typecheck

      - name: Production build
        run: npm run build

      - name: Upload static web build
        uses: actions/upload-artifact@v4
        with:
          name: gridsplit-studio-pdf-import-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 14

      - name: Commit the generated lockfile when changed
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore: sync npm lockfile for PDF.js [skip ci]"
          git push origin "HEAD:${GITHUB_REF_NAME}"
