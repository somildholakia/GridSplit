name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gridsplit-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Lint, test, typecheck and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Set up uv and Python 3.12
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.5"
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: |
            local-tts/pyproject.toml
            local-tts/uv.lock

      - name: Generate the local TTS dependency lock
        run: uv lock --project local-tts

      - name: Upload resolved Python lockfile
        uses: actions/upload-artifact@v4
        with:
          name: gridsplit-local-tts-uv-lock-${{ github.sha }}
          path: local-tts/uv.lock
          if-no-files-found: error
          retention-days: 7

      - name: Audit the resolved Python dependency graph
        run: uv run --project local-tts --locked --group dev pip-audit --strict

      - name: Install FFmpeg for local-render smoke test
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Check Python sidecars and local renderer
        run: |
          python -m py_compile local-tts/server.py local-render/server.py
          python -m unittest discover -s local-tts -p 'test_*.py'
          python -m unittest discover -s local-render -p 'test_*.py'

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test -- --reporter=verbose

      - name: Typecheck
        run: npm run typecheck

      - name: Production build
        run: npm run build

      - name: Upload static web build
        uses: actions/upload-artifact@v4
        with:
          name: gridsplit-studio-web-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 14
