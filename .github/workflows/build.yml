name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gridsplit-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Lint, test, typecheck and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Emit initial npm lockfile for check-in
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          node --input-type=module -e 'import { readFileSync } from "node:fs"; const encoded = readFileSync("package-lock.json").toString("base64"); console.log("LOCKFILE_BASE64_BEGIN"); for (let i = 0; i < encoded.length; i += 4000) console.log("LOCKFILE_CHUNK:" + encoded.slice(i, i + 4000)); console.log("LOCKFILE_BASE64_END");'

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test -- --reporter=verbose

      - name: Typecheck
        run: npm run typecheck

      - name: Production build
        run: npm run build

      - name: Upload static web build
        uses: actions/upload-artifact@v4
        with:
          name: gridsplit-studio-web-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 14
