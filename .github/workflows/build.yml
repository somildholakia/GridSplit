name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gridsplit-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Lint, test, typecheck and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund


      - name: Install FFmpeg for local-render smoke test
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Check Python sidecars and local renderer
        run: |
          python -m py_compile local-tts/server.py local-render/server.py
          python -m unittest discover -s local-tts -p 'test_*.py'
          python -m unittest discover -s local-render -p 'test_*.py'

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test -- --reporter=verbose

      - name: Typecheck
        run: npm run typecheck

      - name: Production build
        run: npm run build

      - name: Upload static web build
        uses: actions/upload-artifact@v4
        with:
          name: gridsplit-studio-web-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 14
